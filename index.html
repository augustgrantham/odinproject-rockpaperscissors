<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
    <style>
        body {
            text-align: center;
            padding: 1em;
        }
        button {
            margin:1em;
        }
        span {
            display:block;

    <span>Result: </span>
    <span id="human">Human: </span>
    <span id="robot">Robot: </span>
</body>
</html>
